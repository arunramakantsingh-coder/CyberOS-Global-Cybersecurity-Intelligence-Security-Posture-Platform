name: CyberOS M2 validation
on:
  push:
    branches: ['foundation/**']
  pull_request:
    branches: ['foundation/**']
jobs:
  portal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package.json
      - run: npm install
      - run: npm run build
  api-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile app/main.py app/threat_intelligence.py
